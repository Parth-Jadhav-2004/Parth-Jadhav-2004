name: Refresh profile stats

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate profile cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/github-stats-dark.svg assets/github-stats-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh GitHub profile statistics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
